<title>Siege Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an annotated survey. The map is the sheet; the record sits in the margin; the timeline runs under both.
   Colour by role: the player's defences blue, Synthexis aqua (its green in the game), its siege machinery orange. */
:root {
  --surface: #fcfcfb; --sheet: #f3f5f4; --raise: #eceeed; --rule: #dfe2e0; --grid: #e8eae9;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #85847e;
  --foe: #2a78d6; --ours: #1baf7a; --siege: #eb6834;
  --wall: #a3a8a6; --building: #c9cdcb; --mine: #9a8466; --dead: #0b0b0b;
  --band-a: rgba(11, 11, 11, 0.035); --band-b: rgba(11, 11, 11, 0.075);
  --ui: "IBM Plex Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --sheet: #141413; --raise: #242423; --rule: #353533; --grid: #2a2a29;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --foe: #3987e5; --ours: #199e70; --siege: #d95926;
    --wall: #6f7472; --building: #3b3f3d; --mine: #8a7556; --dead: #f0efec;
    --band-a: rgba(240, 239, 236, 0.03); --band-b: rgba(240, 239, 236, 0.07);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --sheet: #141413; --raise: #242423; --rule: #353533; --grid: #2a2a29;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
  --foe: #3987e5; --ours: #199e70; --siege: #d95926;
  --wall: #6f7472; --building: #3b3f3d; --mine: #8a7556; --dead: #f0efec;
  --band-a: rgba(240, 239, 236, 0.03); --band-b: rgba(240, 239, 236, 0.07);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--surface); color: var(--ink); font: 15px/1.45 var(--ui); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--foe); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
h1 { margin: 0; font-size: 19px; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; border-right: 1px solid var(--rule); padding: 4px 12px; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--raise); color: var(--ink); font-weight: 500; }
.trials button { display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.view { min-height: 0; }
.replay { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; height: 100%; }
.mapwrap { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-height: 340px; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.layers { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 210px); }
.chip { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 1px 10px; font-size: 13px; cursor: pointer; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="false"] .dot { opacity: 0.35; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }
.zoom button { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; min-width: 30px; height: 28px; cursor: pointer; padding: 0 9px; font-size: 13px; }
.legend { position: absolute; left: 10px; bottom: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); max-width: calc(100% - 20px); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend svg { flex: none; }
#tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; font-size: 13px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 16px; max-width: min(520px, 90%); color: var(--ink-2); }
.empty b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 2px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; grid-row: 1 / 3; grid-column: 2; }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; text-wrap: balance; }
h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.state { font-size: 12px; padding: 1px 8px; border-radius: 10px; font-weight: 500; display: inline-flex; gap: 5px; align-items: center; background: var(--raise); color: var(--ink-2); }
.bars { display: grid; gap: 5px; font-size: 13px; }
.bar { display: grid; grid-template-columns: 118px 1fr 46px; gap: 8px; align-items: center; }
.bar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.bar svg { display: block; width: 100%; height: 10px; }
.bar > span:last-child { font-family: var(--mono); text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.notes { display: grid; gap: 1px; font-size: 13px; max-height: 280px; overflow-y: auto; }
.note { display: grid; grid-template-columns: 44px 1fr; gap: 8px; background: none; border: 0; text-align: left; padding: 3px 4px; cursor: pointer; border-radius: 4px; }
.note:hover { background: var(--raise); }
.note time { font-family: var(--mono); color: var(--ink-3); font-size: 12px; }
.close { background: none; border: 1px solid var(--rule); border-radius: 6px; color: var(--ink-2); cursor: pointer; padding: 0 8px; font-size: 13px; }
.muted { color: var(--ink-2); font-size: 14px; margin: 0; }
.link { background: none; border: 0; color: var(--foe); cursor: pointer; padding: 0; font-size: 14px; }
.timeline { grid-column: 1; display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; }
.play { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; width: 38px; height: 32px; cursor: pointer; }
select { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; }
.tl { position: relative; height: 40px; min-width: 0; }
#tl { position: absolute; inset: 0; width: 100%; height: 100%; }
#scrub { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; margin: 0; }
.clock { font-family: var(--mono); font-size: 13px; color: var(--ink-2); min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; }
.clock b { color: var(--ink); font-weight: 500; }
/* Stats and the comparison: a scrolling sheet of figures. */
.sheet { overflow-y: auto; height: 100%; display: grid; gap: 20px; align-content: start; padding-bottom: 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; display: grid; gap: 2px; }
.tile .l { font-size: 13px; color: var(--ink-2); }
.tile .v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 13px; color: var(--ink-2); }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
figure { margin: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; min-width: 0; position: relative; }
figcaption { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
figcaption small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-2); }
.chart { width: 100%; height: 220px; display: block; overflow: visible; }
.chart.small { height: 170px; }
.ctip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 9px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); white-space: nowrap; }
.ctip b { font-weight: 600; } .ctip .r { display: flex; gap: 6px; align-items: center; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 500; font-size: 13px; }
th button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font: inherit; }
td.n, th.n { text-align: right; font-family: var(--mono); font-size: 13px; }
tr.pick { cursor: pointer; } tr.pick:hover td { background: var(--raise); }
.section-note { font-size: 14px; color: var(--ink-2); margin: -10px 0 0; max-width: 72ch; }
@media (max-width: 900px) {
  .app { height: auto; }
  .replay { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; }
  .mapwrap { height: 62vh; }
  .panel { grid-row: auto; grid-column: 1; }
  .timeline { grid-column: 1; grid-template-columns: auto auto 1fr; }
  .clock { grid-column: 1 / -1; text-align: left; }
  .layers { max-width: calc(100% - 20px); top: 48px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header>
    <h1>Siege Lab</h1>
    <div class="seg trials" id="tabs" role="tablist" aria-label="Trial"></div>
    <div class="seg" id="views" aria-label="View">
      <button data-v="replay" aria-pressed="true">Replay</button><button data-v="stats" aria-pressed="false">Stats</button><button data-v="across" aria-pressed="false">Across trials</button>
    </div>
    <span class="sub" id="sub"></span>
  </header>

  <section class="view replay" id="v-replay">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Map of the trial"></canvas>
      <div class="layers" id="layers"></div>
      <div class="zoom">
        <button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button>
        <button id="zfit">Fortress</button><button id="zwave">Wave</button>
      </div>
      <div class="legend" id="legend"></div>
      <div id="tip" hidden></div>
      <div class="empty" id="empty" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
    <div class="timeline">
      <button class="play" id="play" aria-label="Play">▶</button>
      <select id="speed" aria-label="Playback speed">
        <option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option><option value="64">64×</option>
      </select>
      <div class="tl"><canvas id="tl"></canvas><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Time in the trial"></div>
      <div class="clock" id="clock"></div>
    </div>
  </section>

  <section class="view sheet" id="v-stats" hidden></section>
  <section class="view sheet" id="v-across" hidden></section>
</div>

<script>
const DATA = __LAB_DATA__;
const N = DATA.names, MED = DATA.medium_hp || 75;
const nm = i => (i != null && i >= 0) ? N[i] : null;
const short = s => s ? s.replace(/^lp-bred-/, "").replace(/-turret$/, "").replace(/^lp-/, "").replace(/-/g, " ") : "?";
const fmtT = ticks => { const s = Math.max(0, Math.round(ticks / 60)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const fmt = (v, d = 0) => v == null || isNaN(v) ? "–" : Number(v).toLocaleString("en", { maximumFractionDigits: d, minimumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STAGE_NAME = { scout: "scouting", gather: "gathering", march: "march", stage: "staging", breach: "breach", inside: "inside", withdraw: "withdrawal", blind: "blind", done: "done" };
let C = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);
  ["surface", "sheet", "raise", "rule", "grid", "ink", "ink-2", "ink-3", "foe", "ours", "siege", "wall", "building", "mine", "dead", "band-a", "band-b"].forEach(k => C[k] = s.getPropertyValue("--" + k).trim());
}
readColors();

// The player's things, by kind.
function kindOf(e) {
  const t = nm(e[4]) || "", n = nm(e[0]) || "";
  if (t === "wall" || t === "gate") return "wall";
  if (t === "land-mine") return "mine";
  if (t === "electric-turret") return "laser";
  if (t === "ammo-turret") return "gun";
  if (t === "fluid-turret") return "flamethrower";
  if (t === "artillery-turret") return "artillery";
  if (n === "pipe" || t === "pipe") return "pipe";
  if (t === "electric-pole") return "pole";
  return "building";
}
const ENTS = DATA.ents.map((e, i) => ({ i, name: nm(e[0]), x: e[1], y: e[2], max: e[3] || 1, kind: kindOf(e) }));
const TURRETS = new Set(["laser", "gun", "flamethrower", "artillery"]);
const isDef = e => TURRETS.has(e.kind) || e.kind === "wall" || e.kind === "mine";
const GRID = new Map();
ENTS.forEach(e => { const k = Math.floor(e.x) + "," + Math.floor(e.y); (GRID.get(k) || GRID.set(k, []).get(k)).push(e); });
function entNear(x, y, name) {
  let best = null, bd = 2.25;
  for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) for (const e of GRID.get((Math.floor(x) + dx) + "," + (Math.floor(y) + dy)) || []) {
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if ((!name || e.name === name) && d < bd) { best = e; bd = d; }
  }
  return best;
}

// Each trial prepared once.
const prep = DATA.trials.map(tr => {
  const P = { tracks: new Map(), entHp: new Map(), deathOf: new Map(), entDeath: new Map(), killsBy: new Map(), deaths: [], times: tr.frames.map(f => f[0]), big: new Map(), target: new Map() };
  tr.units.forEach((us, fi) => us.forEach(u => {
    let t = P.tracks.get(u[0]);
    if (!t) { t = { id: u[0], name: nm(u[1]), role: ["herd", "burster", "scout", "sweep"][u[5]], max: 0, pts: [] }; P.tracks.set(u[0], t); }
    t.max = Math.max(t.max, u[4]); t.pts.push([fi, u[2], u[3], u[4]]);
  }));
  tr.defhp.forEach(([fi, i, hp]) => (P.entHp.get(i) || P.entHp.set(i, []).get(i)).push([fi, hp]));
  tr.big.forEach(([fi, id, tx, ty]) => { (P.big.get(fi) || P.big.set(fi, []).get(fi)).push([id, tx, ty]); if (!P.target.has(id)) P.target.set(id, [tx, ty, fi]); });
  tr.deaths.forEach(d => {
    const D = { t: d[0], id: d[1], name: nm(d[2]), force: nm(d[3]), x: d[4], y: d[5], killer: nm(d[6]), kx: d[7], ky: d[8], kid: d[9], dt: nm(d[10]), def: d[11] };
    if (D.def >= 0) P.entDeath.set(D.def, D);
    if (D.id != null && D.force === "lp-biotech") P.deathOf.set(D.id, D);
    if (D.kx != null && D.force === "lp-biotech") {
      const k = entNear(D.kx, D.ky, D.killer);
      if (k) { D.kent = k.i; (P.killsBy.get(k.i) || P.killsBy.set(k.i, []).get(k.i)).push(D); }
    }
    P.deaths.push(D);
  });
  P.worthOf = id => { const t = P.tracks.get(id); return t ? (t.role === "burster" ? 0 : t.max / MED) : 0; };
  return P;
});
const frameAt = (P, t) => { let lo = 0, hi = P.times.length - 1; if (hi < 0) return 0; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (P.times[m] <= t) lo = m; else hi = m - 1; } return lo; };
const t0Of = tr => tr.launch || tr.start;
function entHpAt(P, i, f) { const h = P.entHp.get(i); if (!h) return null; let v = null; for (const [fi, hp] of h) { if (fi <= f) v = hp; else break; } return v; }
function outcomeOf(tr) {
  if (tr.outcome === "held") return "no wave";
  if (tr.outcome === "timeout") return "timed out";
  return tr.wave && tr.wave.inside ? "got in" : "held out";
}

// State.
let T = 0, F = 0, sel = null, playing = false, acc = 0, last = 0, VIEW = "replay";
const layers = { costmap: false, buildings: true, defences: true, plan: true, units: true, deaths: true, kills: true, bursters: true };
try { const s = JSON.parse(localStorage.getItem("lab-layers2") || "null"); if (s) Object.assign(layers, s); } catch (e) {}

// ---------- the map ----------
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
const cam = { x: 0, y: 0, s: 4 };
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const t = document.getElementById("tl"), tr = t.getBoundingClientRect(); t.width = Math.round(tr.width * dpr); t.height = Math.round(tr.height * dpr);
  draw(); drawTimeline();
}
const sx = x => (x - cam.x) * cam.s + W / 2, sy = y => (y - cam.y) * cam.s + H / 2;
const wx = px => (px - W / 2) / cam.s + cam.x, wy = py => (py - H / 2) / cam.s + cam.y;
function fitBox(x0, y0, x1, y1) { cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2; cam.s = Math.max(0.3, Math.min(30, Math.min(W / Math.max(10, x1 - x0), H / Math.max(10, y1 - y0)) * 0.9)); draw(); }
function fitFortress() {
  const c = DATA.center || [0, 0]; let x0 = c[0] - 60, y0 = c[1] - 60, x1 = c[0] + 60, y1 = c[1] + 60;
  ENTS.forEach(e => { if ((TURRETS.has(e.kind) || e.kind === "wall") && Math.abs(e.x - c[0]) < 150 && Math.abs(e.y - c[1]) < 150) { x0 = Math.min(x0, e.x); y0 = Math.min(y0, e.y); x1 = Math.max(x1, e.x); y1 = Math.max(y1, e.y); } });
  fitBox(x0 - 25, y0 - 25, x1 + 25, y1 + 25);
}
function fitWave() {
  const tr = DATA.trials[T], P = prep[T]; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  (tr.plan.path || []).forEach(p => add(p[0], p[1])); P.tracks.forEach(t => t.pts.forEach(p => add(p[1], p[2])));
  const c = DATA.center || [0, 0]; add(c[0] - 50, c[1] - 50); add(c[0] + 50, c[1] + 50);
  if (isFinite(x0)) fitBox(x0 - 20, y0 - 20, x1 + 20, y1 + 20);
}
function cross(X, Y, r, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w || 1.6; ctx.beginPath(); ctx.moveTo(X - r, Y - r); ctx.lineTo(X + r, Y + r); ctx.moveTo(X + r, Y - r); ctx.lineTo(X - r, Y + r); ctx.stroke(); }
function diamond(X, Y, r) { ctx.beginPath(); ctx.moveTo(X, Y - r); ctx.lineTo(X + r, Y); ctx.lineTo(X, Y + r); ctx.lineTo(X - r, Y); ctx.closePath(); }
function alpha(hex, a) { const h = hex.replace("#", ""); const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

function draw() {
  if (!W || VIEW !== "replay") return;
  const tr = DATA.trials[T], P = prep[T], now = P.times.length ? P.times[F] : tr.end;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.sheet; ctx.fillRect(0, 0, W, H);
  // The planner's 32-tile cell, as a hairline grid.
  const g = 32;
  if (cam.s * g > 18) {
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = Math.floor(wx(0) / g) * g; x < wx(W); x += g) { ctx.moveTo(Math.round(sx(x)) + 0.5, 0); ctx.lineTo(Math.round(sx(x)) + 0.5, H); }
    for (let y = Math.floor(wy(0) / g) * g; y < wy(H); y += g) { ctx.moveTo(0, Math.round(sy(y)) + 0.5); ctx.lineTo(W, Math.round(sy(y)) + 0.5); }

function trialStats(k) {
  const tr = DATA.trials[k], P = prep[k], w = tr.wave;

    [sw(`<circle cx="7" cy="7" r="5" fill="none" stroke="var(--foe)" stroke-width="1.5"/><path d="M4 4L10 10M10 4L4 10" stroke="var(--dead)" stroke-width="1.6"/>`), "Destroyed"],
    [sw(`<rect x="3" y="3" width="8" height="8" fill="var(--wall)"/>`), "Wall"],
    [sw(`<circle cx="7" cy="7" r="5" fill="var(--ours)"/>`), "Synthexis"],
    [sw(`<path d="M7 1L13 7L7 13L1 7Z" fill="var(--siege)"/>`), "Big burster"],
    [sw(`<path d="M3 3L11 11M11 3L3 11" stroke="var(--ours)" stroke-width="1.8"/>`), "Its dead"],
    [sw(`<path d="M1 7H13" stroke="var(--siege)" stroke-width="2" stroke-dasharray="3 2"/>`), "Its plan"],
    [sw(`<circle cx="7" cy="7" r="5" fill="none" stroke="var(--siege)" stroke-width="2"/><circle cx="7" cy="7" r="2" fill="var(--siege)"/>`), "Planned breach"],
  ].map(([s, l]) => `<span>${s}${l}</span>`).join("");
}

// ---------- pointer, playback, keys ----------
let drag = null; const tip = document.getElementById("tip");
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; cam.x = drag.cx - dx / cam.s; cam.y = drag.cy - dy / cam.s; draw(); tip.hidden = true; return; }
  const o = pick(px, py);
  if (o) { tip.hidden = false; tip.textContent = label(o); tip.style.left = Math.min(px + 12, W - 200) + "px"; tip.style.top = (py + 14) + "px"; cv.style.cursor = "pointer"; } else { tip.hidden = true; cv.style.cursor = "crosshair"; }
});
cv.addEventListener("pointerup", e => { const r = cv.getBoundingClientRect(); if (drag && !drag.moved) { sel = pick(e.clientX - r.left, e.clientY - r.top); renderPanel(); draw(); } drag = null; });
cv.addEventListener("pointerleave", () => { tip.hidden = true; });
cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, bx = wx(px), by = wy(py); cam.s = Math.max(0.3, Math.min(40, cam.s * Math.exp(-e.deltaY * 0.0015))); cam.x = bx - (px - W / 2) / cam.s; cam.y = by - (py - H / 2) / cam.s; draw(); }, { passive: false });
const zoomBy = k => { cam.s = Math.max(0.3, Math.min(40, cam.s * k)); draw(); };
document.getElementById("zin").onclick = () => zoomBy(1.4); document.getElementById("zout").onclick = () => zoomBy(1 / 1.4);
document.getElementById("zfit").onclick = fitFortress; document.getElementById("zwave").onclick = fitWave;
const playBtn = document.getElementById("play"), speedSel = document.getElementById("speed");
playBtn.onclick = () => { if (!DATA.trials[T].frames.length) return; playing = !playing; if (playing && F >= DATA.trials[T].frames.length - 1) F = 0; playBtn.textContent = playing ? "❚❚" : "▶"; playBtn.setAttribute("aria-label", playing ? "Pause" : "Play"); last = performance.now(); acc = 0; requestAnimationFrame(tick); };
function tick(now) { if (!playing) return; acc += (now - last) / 1000 * 2 * (+speedSel.value); last = now; const st = Math.floor(acc); if (st > 0) { acc -= st; seek(F + st); if (F >= DATA.trials[T].frames.length - 1) { playing = false; playBtn.textContent = "▶"; } } requestAnimationFrame(tick); }
scrub.addEventListener("input", () => seek(+scrub.value));
document.addEventListener("keydown", e => {
  if (VIEW !== "replay" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target !== scrub) return;
  if (e.code === "Space" && e.target === document.body) { e.preventDefault(); playBtn.click(); }
  if (e.key === "ArrowRight" && e.target === document.body) seek(F + (e.shiftKey ? 20 : 1));
  if (e.key === "ArrowLeft" && e.target === document.body) seek(F - (e.shiftKey ? 20 : 1));
  if (e.key === "Escape") { sel = null; renderPanel(); draw(); }
});
// The theme can change under the page: colours read again, everything redrawn.
const mq = matchMedia("(prefers-color-scheme: dark)");
const retheme = () => { readColors(); buildLayers(); update(); if (VIEW === "stats") renderStats(); if (VIEW === "across") renderAcross(); };
mq.addEventListener("change", retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

new ResizeObserver(resize).observe(document.getElementById("mapwrap"));
buildLayers(); buildTabs(); resize(); fitFortress();
setTrial(Math.max(0, DATA.trials.findIndex(t => t.frames.length)));
</script>
