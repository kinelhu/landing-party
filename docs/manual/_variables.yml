desc:
  entity_player_dome: "Stops enemy artillery shells within its radius while powered. Goes down for a time after too many hits."
  entity_flak_turret: "Fires flak at flying units only."
  entity_tesla: "Its lightning jumps between targets and briefly stops the laser and tesla turrets it hits."
  entity_dome_projector: "Holds a shield over part of a Kessler-Hayashi base that stops artillery shells. Units pass under it."
  entity_orbital_relay: "Directs Kessler-Hayashi's orbital strikes on spawners near its base."
  entity_pen: "A biter spawner taken over by Synthexis. Drops pheromone glands."
  entity_bred_cinder: "A fast biter that bursts on death, damaging nearby walls and turrets."
  entity_bred_big_burster: "A huge biter that bursts at a turret guarding the way in, damaging all turrets nearby."
  entity_bred_scout: "Circles your defenses before an attack."
  entity_bred_carrier: "Carries a new Synthexis culture to wild spawners."
  entity_harrier: "A cheap flying drone that attacks in numbers."
  entity_scavenger: "A flying bomb that targets artillery, mortars and radars."
  entity_laser_drone: "An armored flying drone with a laser. Resists bullets."
  entity_skyguard: "A trooper with a long-range laser against flying units. Weak against ground targets."
  entity_flak_buggy: "Fires flak at flying units. Weak against ground targets."
  entity_bred_spore: "Spits spores that hit flying units. Weak against ground targets."
  entity_bred_stomper: "A bred pentapod that steps over walls. Resists bullets."
  entity_biochamber: "Feeds a Synthexis incubator so it can breed."
  entity_clinic: "Makes Synthexis biters stronger. Without it, only small and medium biters are bred."
  entity_runt: "Tests your defenses for gaps before an attack."
  entity_sweeper: "Bursts in minefields to clear a path before an attack."
  entity_tumor: "Spreads Synthexis creep around it. Nothing can be built on creep."
  entity_bred: "Bred by Synthexis. Wild biters and Synthexis biters do not attack each other."
  entity_skim_yard: "Stores what Grubstake has stolen. Drops its contents when destroyed."
  entity_invoice_post: "Bills you for biter attacks caused by your pollution. Paying in full with circuits, modules or steel buys a truce of 10 to 60 minutes."
  entity_muster_point: "Turns unit orders into units and sends them to the nearest rally beacon."
  entity_threat_scanner: "Outputs the number of faction units and biters within 64 tiles, by type."
  entity_jammer: "Destroys construction and logistic robots in range."
  entity_claim_stake: "Grubstake claims the ore here when the lamp runs out, unless the ore is being mined or the stake is destroyed."
  entity_barracks: "Trains units from orders."
  entity_rally_beacon: "Gathers units and gives them orders by signal."
  entity_command_relay: "Lets you command 10 more units while powered. Research raises how many relays count."
  entity_border_stake: "Sets a border with the nearest Kessler-Hayashi base. Its perimeter stops at the stake."
  entity_trade_post: "Grubstake collects the items placed here in exchange for a truce."
  entity_pact_breaker: "Jams Grubstake's pact with the biters for 3 minutes. Works only inside a Grubstake claim."
  entity_claim_marker: "Grubstake leaves your buildings within 40 tiles alone."
  entity_strike_beacon: "Charges from your power, then calls an orbital barrage on enemies within 60 tiles. Single use."
  entity_player_mortar: "Short-range artillery that fires mortar shells."
  entity_strip_drill: "Mines twice as fast as an electric mining drill and depletes ore at half the rate."
  entity_player_bait: "Makes nearby biters attack whatever is around it."
  entity_pacifier: "Keeps biters from attacking Grubstake. Drops pheromone glands, and sometimes a pacifier crystal."
  entity_claim_rig: "Digs a tunnel toward your base for a Grubstake raiding crew."
  entity_power_tap: "Draws power from your electric network."
  entity_power_receiver: "Draws power from your electric network."
  entity_uplink: "A faction's headquarters. Destroying it makes the faction withdraw."
  entity_lander: "The center of a faction base. Destroying it destroys the base."
  technology_study_claims: "Study the cargo of Grubstake's raiders and haulers to learn where it prospects."
  technology_study_strip: "Study the drills Grubstake uses to strip-mine ore."
  technology_study_bait: "Study how Grubstake's pacifier antennas keep biters away."
  technology_study_flak: "Study Grubstake's scrap cannons and drones."
  technology_study_telemetry: "Study how Synthexis's bred biters differ from wild ones."
  technology_study_defoliant: "Study what kills Synthexis creep."
  technology_claims_register: "Labels Grubstake's claims with their ore, reveals the ground around them and marks its strip camps on the map."
  technology_strip_drill: "A drill that mines twice as fast as an electric mining drill and depletes ore at half the rate."
  technology_bait_made: "Pheromone bait made without a gland. Bait placed inside a Grubstake claim also jams Grubstake's pact."
  technology_flak_turret: "A powered turret that fires flak at flying units only."
  technology_bred_telemetry: "Threat scanners report Synthexis biters and scouts apart from wild biters."
  technology_defoliant: "A thrown capsule that removes creep within 6 tiles and damages tumors."
  technology_incubator_capture: "Synthexis incubators can be captured like biter spawners."
  technology_player_dome: "A powered dome that stops enemy artillery shells over your defenses."
  technology_pact_breaker: "Jams Grubstake's pact with the biters for 3 minutes. Works only inside a Grubstake claim."
  technology_claim_marker: "A marker that makes Grubstake leave your buildings within 40 tiles alone."
  technology_orbital_strike: "A single-use beacon that calls an orbital barrage on enemies within 60 tiles."
  technology_rail_rifle: "A rifle whose slugs pierce every enemy in a 30-tile line."
  technology_pheromone_bait: "Bait that makes nearby biters attack whatever is around it."
  technology_cluster_shells: "Artillery shells that burst into bomblets on impact."
  technology_command_bandwidth: "Increases the number of command relays that control your units."
  technology_prize_serenity: "Unlocks the mortar and mortar shells."
  technology_prize_grubstake: "Unlocks the strip drill."
  item_command_core: "Used to build a barracks. Salvaged from faction bases."
  item_defoliant: "Removes Synthexis creep within 6 tiles and damages tumors."
  item_rail_rifle: "Fires slugs that pierce every enemy in a 30-tile line."
  item_rail_slug: "Pierces every enemy in a 30-tile line."
  item_cluster_artillery_shell: "Bursts into 10 bomblets on impact."
  item_mortar_shell: "Ammunition for the mortar."
  item_trooper_order: "Becomes a unit when placed in a muster point."
  item_breacher_order: "Becomes a unit when placed in a muster point."
  item_rocket_trooper_order: "Becomes a unit when placed in a muster point."
  item_flame_trooper_order: "Becomes a unit when placed in a muster point."
  item_battle_tank_order: "Becomes a unit when placed in a muster point."
  item_pheromone_gland: "Salvaged from Grubstake pacifier antennas and Synthexis incubators."
  item_pacifier_crystal: "Salvaged from Grubstake pacifier antennas."
  item_drill_head: "Salvaged from Grubstake claim jumper rigs."
  item_rail_coil: "Salvaged from Kessler-Hayashi railgunners."
  item_cluster_fuze: "Salvaged from Kessler-Hayashi mortars and howitzers."
  item_orbital_beacon: "Salvaged from Kessler-Hayashi landers and uplinks."
  item_fuze_schematic: "Crafting it unlocks a faction technology."
  item_gland_schematic: "Crafting it unlocks a faction technology."
  item_coil_schematic: "Crafting it unlocks a faction technology."
  item_beacon_schematic: "Crafting it unlocks a faction technology."
  item_crystal_schematic: "Crafting it unlocks a faction technology."
