# The Landing Party player manual: a Quarto book. The PDF is an A5 field manual in the manner of a 1990s game-box
# booklet (_extensions/lp-manual, format lp-manual-pdf); the HTML is the same text with plain versions of its cards,
# trees and lore pages (the same filter, `filters: [lp-manual]`).
#   quarto render docs/manual --to lp-manual-pdf      (the booklet, _book/Landing-Party.pdf)
#   quarto render docs/manual --to kinan-html         (the web book, _book/index.html)
# The numbers come from scripts/roster_page.py --qmd (scripts/manual_qmd.py): _variables.yml, _generated/*.qmd, and
# _generated/lp-data.json, the cards' and trees' data, with the words the code does not hold in words.cfg. Run it after a
# change to the prototypes, shared.lua, the scripts or the locale. No chapter types a number.
# To print: _extensions/lp-manual/impose.sh on the PDF, double-sided, flipped on the short edge, folded and stapled.
project:
  type: book
  output-dir: _book

book:
  title: "Landing Party"
  subtitle: "Field manual"
  author: "kinelhu"
  chapters:
    - index.qmd
    - arrivals.qmd
    - kessler-hayashi.qmd
    - grubstake.qmd
    - synthexis.qmd
    - rivals.qmd
    - army.qmd
    - spoils.qmd
    - reference.qmd
    - tips.qmd

number-sections: false
lang: en-US

# The cover's edition line ("For Landing Party <version>") comes from the data file (lp-data.json's edition).
inside-cover: |
  **Landing Party** is a mod for Factorio with Space Age. This field manual describes the factions that land on your
  planet and how each one is beaten. Every number in it is read from the mod's own code and prototypes, so it matches
  the version named on the cover.

  The bars on a unit's card measure it against the strongest of its own side: a full health bar is that faction's
  toughest unit, not the toughest in the game.
back-blurb: |
  Three companies have come to Nauvis. Grubstake lands once you make chemical science and takes whatever you leave
  unguarded. Kessler-Hayashi lands after your first rocket and lays siege to your walls. Synthexis takes over the biter
  nests and breeds waves to break your defenses.

  This manual describes each faction, its units, and how to beat it.
back-small: |
  Landing Party is a fan-made mod for Factorio. Factorio and Space Age are games by Wube Software; this booklet is not
  affiliated with them. Set in Alegreya and Titillium Web.

format:
  kinan-html:
    toc: true
    toc-depth: 2
    filters:
      - lp-manual
  lp-manual-pdf:
    keep-tex: true
    fig-pos: "!htb"
