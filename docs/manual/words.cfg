[blurb]
lp-infantry=Every Kessler-Hayashi camp lands with Laser troopers, a mech-armor suit with a laser rifle worn by most of its raiders. The rifle's beam is short and quick, and the Armory's Warden plating, once bolted on, turns an ordinary magazine into a slow way to kill one. Hit them with fire or a tank's shell, which the plating does nothing against.
lp-tank=A camp's tank is the piece built for masonry, a standard hull whose shell does three times to a building what it does to a unit. Tanks are the body of a siege escort, holding in ranks outside the guns' reach until the mortars have worked, then going in through the breach. Rocket troopers and a battle tank outfight it; your troopers do not.
lp-railgunner=A size up from the Laser trooper and charcoal like the walls, the Railgunner carries a rail cannon on the company's heaviest suit. Its slug goes through everything living on a long line, so a nest field is cleared in an afternoon; it never joins a raid, and a wall barely notices it. Some carry the rail coils your rail rifle is made from.
lp-laser-drone=Kessler-Hayashi's one flier is the Laser drone, a destroyer's body in the company's colors with armor plate where the destroyer had none and a laser slung under it. The second shipment brings a few to each camp, and they cross walls, cliffs and water while bullets glance off the plate. Rocket troopers and a flak turret bring them down; put your flak where they cross the wall.
lp-skyguard=The Armory refits a Laser trooper into the Anti-air trooper by swapping the rifle for a long tracking laser that follows a flier across the sky and burns it down; pointed at the ground, the same emitter does little. A camp fields them beside its Laser troopers, never instead. Keep your combat robots away from them and walk the ground squads straight past.
lp-lance=Where the Laser trooper's rifle was, the Heavy laser trooper carries the Optics lab's long emitter and a pack that weighs more than the trooper. Its beam reaches past a submachine gun's and goes through flat armor, so a Lance stands off and fires. Close the distance with your vehicles, or put a gun turret in front of it, which still outreaches it.
lp-shock=The Optics lab's answer to a crowd is the Shock trooper, whose emitter throws an arc that jumps from the first body it touches to the next, stunning each briefly; against one hull the small hits do almost nothing. The Siege works borrows them for counter-battery parties. Keep your squads spaced, because each arc spends itself on whatever stands close.
lp-aegis=A Heavy tank is the standard hull plated by the Armory and fitted with a rail cannon, firing one heavy slug at a time. No armor resists the slug, so it is the one Kessler-Hayashi vehicle built to kill a battle tank; against troopers it fires too slowly to matter. Rocket troopers reach it from outside its range, so keep yours at full reach.
lp-prism=On the Laser tank a small laser head rides the turret ring, and its beam splits on the first body it touches into forks that find the units round it. Massed troopers are what the Optics lab built it for; a wall takes one beam and a hull one fork, and neither minds. Send a battle tank or rocket troopers at it, never your infantry.
lp-tesla=The Lightning tank carries a tesla turret's head, and its bolt jumps along a line of targets. Each laser or tesla turret it strikes stops for as long as a tesla turret stuns, and stops again at the next strike, so a laser line fires less often while the tank stands at it. Mix gun turrets and flamethrowers into your laser line: lightning does not stop them.
lp-howitzer-truck=Any siege that brings the howitzer brings it on the Howitzer truck, an artillery cannon bolted to a tank's hull at a hauler's pace and with a hauler's gun. The truck never fires the cannon; it drives to the site, the howitzer is set up where roboports cover the target, and the truck gives way. Your artillery outreaches the howitzer and fires on it by itself.
lp-hauler=The Hauler is a lightly armed truck on the tank's running gear, slow, roomy and plated. Kessler-Hayashi uses it for convoys between its camps, and a convoy is where it dies, caught between the camp it left and the one it was going to. Set a squad on the road between two camps and the haulers come to it.
lp-shotgun-hand=Grubstake's soldier is the Shotgun hand, a hired body in heavy armor with a pump shotgun and wrenches. Hands do the work of a raid: they walk up to a machine no gun covers, take it apart and carry it home, fighting only what gets in the way, at close range. Against a turret line they are useless, so a gun turret by each of your outposts is enough.
lp-grubstake-buggy=A Grubstake buggy is a car frame with a machine gun on a pintle and whatever panels the yard had that morning. The one circling a factory at dusk just beyond the guns is noting what stands unguarded, and the raid that follows goes where it went. One killed teaches the next driver to keep wider of that spot, so kill it somewhere you can afford to leave open.
lp-grubstake-harrier=Grubstake's first level buys Scrap drones in numbers, each a distractor's airframe rebuilt from salvage with a light gun under it. They are weak alone and come in swarms over walls, cliffs and water, and against a lone pole or an assembler a swarm is enough. Gun turrets bring them down before they reach anything of yours; a flamethrower turret cannot shoot up.
lp-grubstake-slug=The Slug buggy is the buggy's chassis with the machine gun pulled and a single-barrel slug gun in its place, plated across the front. It fires one heavy slug and then nothing for a while, the right rhythm against a hull and the wrong one against a man on foot; the slug goes through a tank's armor. Send your troopers at it rather than your tanks.
lp-grubstake-sapper=The Dynamite sapper walks in among the Shotgun hands with a satchel of sticks instead of a shotgun, and throws them from well outside a shotgun's reach. Each stick goes off over a few tiles and harms only Grubstake's enemies, so sappers keep no distance from their own side. Keep your squads spread, since a stick that lands on one trooper lands on three.
lp-grubstake-scavenger=Strip the gun from a Scrap drone, fit a charge and a quicker motor, paint it hazard red, and the result is the Bomb drone. It flies over the wall at one thing, an artillery turret, a mortar or a radar, and bursts on arrival, taking itself with it. A gun turret beside each of your artillery turrets gets it, and a flak turret gets it earlier.
lp-grubstake-dozer=For walls the yard builds the Dozer, a hauler's hull with a blade and heavy plate. It does nothing to a unit and rams a fence or a wall open with the Shotgun hands behind it, bullets ringing off the plate. Rocket troopers and a battle tank stop it; put a second wall behind the first, and it has to make two runs under your rockets.
lp-grubstake-flak-buggy=Mounted on a buggy chassis, the car's gun turret with its belts loaded with scrap flak makes the Flak buggy, whose rounds burst over a couple of tiles and tear a drone or a combat robot apart; on the ground the same burst barely scratches a trooper. Any ground unit of yours walks over it, so keep the drones and robots back and send the troopers.
lp-grubstake-scorcher=An old tank hull, the head of a flamethrower turret and a machine gun for the stretches between bursts make the Flame tank. The gun does most of the work; the flame comes in three bursts, and then the tank waits while it refills. Fire never harms it. It has to come close to burn, so your rockets and artillery get their chance first.
lp-grubstake-howitzer-truck=Grubstake's Howitzer truck is the same artillery cannon on a tank's hull that Kessler-Hayashi runs, bought second-hand, and only a camp that landed with a grudge keeps one. It comes out against a wall that robots keep mending, to shell the roboports behind it from far out. Your artillery outreaches it and kills it by itself.
lp-grubstake-hauler=Most of Grubstake's civil service is the Hauler, a lightly armed truck that builds the company's new lots, carries its loot, drives the ore in from its claims and parks beside a belt to skim it. One killed on the road spills its load. Hunt them between a claim and its camp; a claim with no ore coming home lapses, and its drills are yours to take.
lp-bred-small-biter=An incubator's first clutch is small biters, the wild stock's own runt with the green and yellow bands grown in, and the cheapest animal the culture makes. A young culture's waves are mostly small biters, and the clinic moves it on to heavier breeds as its evolution allows. Any turret of yours kills them, as long as something is feeding it.
lp-bred-medium-biter=Armor laid on the small biter's line makes the medium biter, bred once the culture's evolution has climbed. It is also the breed a culture falls back to when its clinic is gone, so a wave of mediums and smalls is a wave from a culture that has lost something. Feed your gun turrets, or set lasers in front of them.
lp-bred-spore=Only one breed looks up, the Spore spitter, a violet-bodied spitter whose spores burst where they land. The culture breeds a few in every clutch, so some travel with most waves. A combat robot or a drone that crosses a wave dies to them, and on the ground the burst is a nuisance. Keep your robots out of a wave's path and let the turrets have it.
lp-bred-medium-spitter=The medium spitter stays back from the wall and lobs acid over it at whatever stands close behind, from the wild stock's own line. Its spit burns and its body does not last, and it is the breed that makes a turret set hard against the wall a bad bargain. Give your turrets reach past the wall, and they kill it where it stands.
lp-bred-cinder=Bred from the small biter's line with the jaws grown out and the acid gland grown in, the burster is a running sac that cannot bite. It makes for a wall or a turret, stops, swells and goes off, and killed on the way it goes off where it dies. Shoot them while they are running; once one has stopped to swell, nothing you do will stop it.
lp-bred-big-biter=The big biter is the body of a grown wave, the wild stock's heavy line bred cheaply enough that a culture spends them freely. The pack pours past the turrets it has no need to fight, for the poles and the inserters behind them. Bury your power and your ammunition feed behind a second line of turrets, since that is where the pack is going.
lp-bred-stomper=The stomper is a pentapod from the Gleba pens, bred small enough to ship and large enough to step over a wall, and nothing about its carapace minds bullets. It steps over the wall the bursters were meant for and goes on to whatever the wave came for. Rocket troopers and a battle tank bring it down; keep your rockets near the wall.
lp-bred-behemoth-biter=Heaviest of what the clinic breeds and the dearest, the behemoth arrives late, when the culture's evolution is nearly spent, and in small numbers. It shrugs off what kills the rest of the wave and walks on. Artillery, massed lasers and a battle tank are what it respects, so keep your wall deep and let the lasers work on it.
lp-bred-big-burster=A gland the size of its head, grown in a behemoth's body, makes the big burster, sent at one of the turrets covering a wave's way in rather than at the wall. At the turret it stops, swells and goes off, and every turret near it is hurt; killed short, only its core goes off. Spread your turrets out, so that a burst at one is a burst at one.
lp-bred-scout=The scout is a small, quick animal bred for each wave and sent round a defense before the wave sets out, looping just outside the guns. It fights nothing; the wave comes whether or not it does, and a scout killed leaves a skull where it fell and the next loop goes wider. When you see one circling your wall, a wave is on its way.
lp-sweeper=Bred for one job, the sweeper walks into a minefield and goes off there, and it is as tough as a behemoth for the few seconds it needs. A wave whose way in crosses mines gets sweepers ahead of it, and the mines they clear stay cleared for the wave behind. Cover your minefields with turrets, or the sweepers clear them for free.
lp-bred-carrier=In deep violet and lit from within, the carrier is a big biter's body that walks an escort of the culture's stock to a wild nest field farther out and founds a new culture there. It fights only what gets in its way and plans its road round cliffs and buildings. Kill it on the road, and the culture it carried never starts.
lp-technician=A Synthexis technician is the only staff the company keeps on the surface, a figure in a sealed suit who walks the rounds between the biochambers with the feed. Without technicians the biochambers stop, and without biochambers the incubators stop breeding, so a technician on the creep is the softest target that matters. Shoot the technicians before the incubators, and send your troopers in behind.
lp-trooper=A trooper is a suit of heavy armor, a submachine gun and a box of magazines, trained at the barracks and the cheapest unit on the command link. Troopers win against raiders, scouts and shotgun hands and lose to lasers with reach, which is why they go out in numbers. Keep them within reach of a powered barracks, since nothing else heals them.
lp-breacher=The breacher carries demolition charges instead of a rifle, in the trooper's heavy armor, and throws them at walls and turrets, which they wreck; thrown at a unit they do little. A breacher is cheap on the command link and useless on its own. Send them in behind troopers that can hold the garrison off, and point them at the pillboxes first.
lp-rocket-trooper=Heavy armor, a rocket launcher and a crate of rockets make the rocket trooper, and each rocket kills armor or a flier and a trooper no faster than a rifle. It takes a larger share of the command link and reaches past a Heavy tank's rail cannon. Keep them behind your troopers against a crowd, and in front against tanks and drones.
lp-flame-trooper=Of the orders a barracks trains, the flamethrower trooper is the one with the shortest reach and the biggest fire. Its flamethrower burns a swarm of biters or a bunched squad in a few passes, does little to a hull, and is outranged by nearly everything that shoots back. Put them at the front against Synthexis and at the back against Kessler-Hayashi.
lp-battle-tank=The battle tank is a tank with cannon shells and personal batteries, and it takes the longest to train and the largest share of bandwidth. Its shell does more than twice to a building what it does to a unit, so it is the answer to a walled camp and a poor one to a crowd. Keep troopers beside yours; heavy tanks, slug buggies and rocket troopers hunt it.
