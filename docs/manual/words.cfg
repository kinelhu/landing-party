[blurb]
lp-infantry=The bulk of every raid and every escort. Kessler-Hayashi fields more of them than of anything else, and its heavier armor research makes them harder to kill with bullets.
lp-tank=The backbone of a siege escort. Tanks hold in staggered ranks just outside your guns' reach and go in behind the barrage.
lp-railgunner=It keeps the camp clear of biters and never joins a raid. Some of them carry the rail coils your rail rifle is made from.
lp-laser-drone=Kessler-Hayashi's sky. Laser drones come from the company's second level, a few at a time, and fly over walls. Bullets barely scratch them.
lp-lance=Fielded once your infantry has cost Kessler-Hayashi enough. Its beam reaches past your troopers', so a trooper line that won the last fight loses the next.
lp-skyguard=Fielded against fliers and combat robots. Its shot at the ground is weak, so a ground push past it costs little.
lp-shock=Its lightning jumps from one trooper to the next and stuns them. A siege facing your artillery brings them too, once the company has learned to.
lp-aegis=A rail cannon on an armored hull, fielded when your vehicles have been killing its units. The slug goes through any armor.
lp-prism=Its laser splits from its target to the units around it. Massed troopers are what it was built for.
lp-tesla=Fielded against turret lines. Its lightning jumps along the line and drains what it strikes, so a thin power supply runs low while it stands there.
lp-howitzer-truck=It comes to sieges where roboports cover the target. Your artillery outranges it and fires on it by itself.
lp-hauler=Kessler-Hayashi's truck. It carries convoys between camps and gets caught on the way.
lp-shotgun-hand=Grubstake's infantry, cheap and quick. Shotgun hands do the work of a raid: they take your machines apart and carry them off.
lp-grubstake-buggy=Fast, light and everywhere. Most of what Grubstake takes from you, it takes with buggies, and the buggy circling just outside your guns is its prowl.
lp-grubstake-harrier=Scrap and a gun, sent in numbers over your walls from Grubstake's first level. Gun turrets bring them down before they reach anything.
lp-grubstake-slug=Grubstake buys them once your vehicles have killed enough of its raiders. A slug hits hard and seldom, so troopers on foot make it work for every kill.
lp-grubstake-sapper=Grubstake fields sappers once your infantry has cost it enough. A squad that keeps its spacing loses less to each throw.
lp-grubstake-scavenger=It dies with its target. Gun turrets by your artillery bring it down on the way in.
lp-grubstake-dozer=A wall that has stopped Grubstake's raids often enough meets a dozer, with shotgun hands behind it.
lp-grubstake-flak-buggy=Scrap flak that bursts in the air. Grubstake buys it once your fliers and combat robots have cost it enough.
lp-grubstake-scorcher=Grubstake buys it against turret lines. It has to come close to burn, so rockets and artillery get their chance on the way in.
lp-grubstake-hauler=It builds Grubstake's new lots, carries its loot and drives the ore home from its claims. One killed on the road spills what it carries.
lp-grubstake-howitzer-truck=Only a camp that landed with a grudge brings one, and only against a wall your robots keep mending.
lp-bred-small-biter=Most of a young culture's waves. Its clinic soon moves it on to bigger breeds.
lp-bred-medium-biter=The breed a culture without its clinic falls back to, with the small biter.
lp-bred-big-biter=Most of any grown wave. A big biter costs the culture little biomass, so it spends them freely.
lp-bred-behemoth-biter=The culture breeds few of them and sends them where the wall is thickest.
lp-bred-medium-spitter=It stays back from the wall and spits over it while the biters break through.
lp-bred-spore=The one breed that looks up. It travels with waves sent at a base that defends itself with drones and robots.
lp-bred-cinder=Bred for walls that have held. It runs to the wall and bursts there, and a well-aimed group takes the corner turrets with it.
lp-bred-stomper=A bred pentapod. It steps over walls and shrugs off bullets.
lp-bred-big-burster=Sent one rank at a time at the turrets covering a wave's way in. Killed short of them, only its core goes off.
lp-bred-scout=When you see one circling your wall, a wave is on its way.
lp-sweeper=Bred when a wave's way in crosses your mines. It walks into the minefield and bursts there.
lp-bred-carrier=It carries a new culture to a wild spawner field farther out. Kill it on the way and the culture never starts.
lp-technician=Without technicians the biochambers stop, and without biochambers the incubators stop breeding.
lp-trooper=Cheap, quick to train and quick to lose. Troopers win against raiders and lose against lasers.
lp-breacher=It throws demolition charges that wreck walls and turrets and do little to units.
lp-rocket-trooper=It kills armor and fliers, and is slow against a crowd.
lp-flame-trooper=It burns swarms of biters and bunched infantry, and is outranged by nearly everything.
lp-battle-tank=The answer to a walled camp. It takes the longest to train and the most bandwidth.
