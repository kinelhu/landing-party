[blurb]
lp-infantry=The Laser trooper is Kessler-Hayashi's standard soldier: mech armor and a short-range laser rifle. Most of its raids and patrols are made of them. Once the Armory has researched heavier armor for them, bullets do much less, so switch to fire or tank shells.
lp-tank=The Tank is Kessler-Hayashi's siege vehicle, and its shell is made for walls and buildings. Tanks make up most of a siege escort: they wait out of range while the mortars work, then drive in through the breach. Rocket troopers and battle tanks beat it; bullets do little.
lp-railgunner=The Railgunner is a heavy trooper with a hand-held rail cannon. It stays out of raids and defends its own camp: it guards the base and its siege guns and clears the biter nests nearby. Its slug punches through a few biters at a time and is strong against nests, but does little to walls. Some drop rail coils, which your rail rifle needs.
lp-laser-drone=The Laser drone is Kessler-Hayashi's only flier, an armored combat drone with a laser. A camp gets a few as it grows. It flies over walls, cliffs and water, and bullets do little to it. Where nothing of yours shoots up, the camp sends its drones alone. Flak turrets, laser turrets and rocket troopers bring it down.
lp-skyguard=The Anti-air trooper is a Laser trooper armed for shooting down fliers. Against ground targets it does very little, and camps field it alongside Laser troopers, never instead of them. Keep your combat robots away from it and send ground units.
lp-lance=The Heavy laser trooper carries a long laser that outranges your submachine guns and cuts through light armor. It stands back and fires. Close the distance with vehicles, or let a gun turret, which still outranges it, deal with it.
lp-shock=The Shock trooper fires an arc of lightning that jumps from target to target. Each hit builds a charge on the unit it strikes, and a unit hit often enough is stunned for a moment. It is made for crowds, and does little to a single vehicle. The Siege works also sends them after your artillery. Keep your squads spread out.
lp-aegis=The Railgun tank is a tank with extra armor and a rail cannon. Its large shell ignores armor, which makes it Kessler-Hayashi's answer to your battle tanks, but it fires too slowly to matter against troopers. Fire does little to it. Your rocket troopers outrange it, so fight it at full range.
lp-prism=The Laser tank's beam splits on the first target it hits and forks into the units around it. It is made to break massed troopers and does little to walls or lone vehicles. Send battle tanks or rocket troopers at it; troopers fare badly.
lp-tesla=The Lightning tank carries a tesla turret's emitter. Its lightning jumps along your turret line, and every laser or tesla turret it hits stops firing for a moment. A few of them slow a laser line badly. Its hits also build a charge on your units until they are stunned. Gun turrets and flamethrowers are not affected, so mix them into the line.
lp-hauler=The Hauler is an armored carrier on Kessler-Hayashi's tank hull, without a turret, that carries a camp's exports by convoy to the camp with its uplink. It is slow and does not fight well. A squad posted on the road between camps will catch them.
lp-shotgun-hand=The Shotgunner is Grubstake's basic soldier: heavy armor, a pump shotgun and a set of wrenches. Shotgunners do the looting. They walk up to machines no turret covers, take them apart and carry them home, and fight only at close range. A gun turret at each outpost keeps them off.
lp-grubstake-buggy=The Buggy is a scrap-plated car with a machine gun, and Grubstake's scout. One circling your base just outside turret range is looking for something unguarded, and the next raid goes where it went. Where a buggy is killed, the next one keeps further away. Its machine gun slows the infantry it hits.
lp-grubstake-harrier=The Scrap copter is a small helicopter built from salvage, with a light gun. Alone it is weak; Grubstake sends them in swarms over walls, cliffs and water, at lone poles and machines. Gun turrets shoot them down. Flamethrower turrets cannot. A copter shot down crashes a few tiles away and damages what it lands on.
lp-grubstake-slug=The Slug buggy trades the buggy's machine gun for a heavy slug gun and adds armor at the front. Its slug pierces a tank's armor, but it fires slowly and does poorly against infantry. Send troopers at it and keep your tanks away.
lp-grubstake-sapper=The Dynamite sapper throws sticks of dynamite from beyond shotgun range. The blast covers a few tiles and does not hurt Grubstake's own units, so sappers fight right among the Shotgunners. Keep your squads spread out.
lp-grubstake-scavenger=The Bomb drone is a small quadcopter with a bomb slung under it. It flies straight at one target, usually an artillery turret, a mortar or a radar, and blows up when it gets there. Shot down, it falls and its bomb goes off where it lands. A gun turret set out in front of each artillery turret stops it short; a flak turret stops it sooner.
lp-grubstake-dozer=The Dozer is a bulldozer with an armored cab. Sent at a wall, it stops short, revs its engine and charges straight through, crushing walls, gates and buildings in its lane, and the buggies follow it in. Rocket troopers and battle tanks stop it. Its charge ends some way past the wall, so a second wall set further back is still standing when it stops.
lp-grubstake-flak-buggy=The Flak buggy is a buggy with a turret that fires scrap flak. The bursts shred drones and combat robots but barely hurt anything on the ground. Keep your combat robots back and send ground units.
lp-grubstake-scorcher=The Flame tank is an old tank hull with a flamethrower and a machine gun. The machine gun does most of the fighting and slows the infantry it hits. Every few seconds the flamethrower burns a group of units in front of it. Fire does not harm it, but it is lightly armored for a tank and has to get close. When it is destroyed, its fuel explodes and burns around the wreck. Hit it with rockets and artillery on the way in.
lp-grubstake-howitzer-truck=The Howitzer truck carries a howitzer on a hauler's chassis, and only a camp that landed with a grudge has one. It comes out against walls that robots keep mending, to shell the roboports behind them. Your artillery outranges it and engages it on its own.
lp-grubstake-hauler=The Hauler does Grubstake's heavy work: it builds new lots, carries loot home, hauls ore from the claims and parks beside your belts to skim them. A destroyed hauler drops its load. Cut the road between a claim and its camp: a claim with no ore coming home lapses, and its drills are yours to take.
lp-bred-small-biter=The small biter is the first and cheapest breed, raised from the wild stock and marked with green and yellow bands. A young culture's waves are mostly small biters. Any turret stops them, as long as it is fed.
lp-bred-medium-biter=The medium biter is the small biter with armor added, bred once the culture's evolution has risen. A culture that has lost its clinic falls back to mediums and smalls. Keep your gun turrets well supplied, or add lasers.
lp-bred-spore=The Spore spitter is the only breed that attacks fliers, with spores that burst where they land. Most waves bring a few. Combat robots and drones that fly over a wave die to them. Keep your robots out of a wave's path and leave it to the turrets.
lp-bred-medium-spitter=The medium spitter stays behind the wall and lobs acid over it at whatever stands close behind. It is fragile, but it punishes turrets placed right against the wall. Give your turrets the reach to hit it beyond the wall.
lp-bred-cinder=The burster is a small biter bred into a walking bomb. It cannot bite. It runs to a wall or turret, stops, swells and explodes, and if killed on the way it explodes where it falls. Shoot bursters while they run: once one has stopped to swell, it will go off.
lp-bred-big-biter=The big biter is the bulk of a grown culture's waves. Big biters run past turrets they have no need to fight and go for the poles and inserters behind them. Protect your power and ammunition supply with a second line of turrets.
lp-bred-stomper=The stomper is a pentapod brought from Gleba, tall enough to step over a wall. Bullets do little to it. It crosses your wall and goes for whatever the wave came for. Rocket troopers and battle tanks bring it down; keep rockets near the wall.
lp-bred-behemoth-biter=The behemoth is the heaviest and most expensive breed. It arrives late and in small numbers, and it survives what kills the rest of the wave. Artillery, massed lasers and battle tanks deal with it. Keep your defenses deep.
lp-bred-big-burster=The big burster is a behemoth bred around an explosive gland. It is sent at one of the turrets covering the wave's approach, and its blast damages every turret nearby. Killed early, only part of it goes off. Space your turrets apart.
lp-bred-scout=The scout is a small, fast biter sent ahead of each wave to circle your defenses just outside turret range. It does not fight. A killed scout leaves a skull where it fell, and the next one circles wider. A scout at your wall means a wave is coming.
lp-sweeper=The sweeper is bred to clear minefields. It walks into the mines and sets them off, tough enough to last the few seconds that takes. Waves whose route crosses mines send sweepers first. Cover your minefields with turrets.
lp-bred-carrier=The carrier is a glowing violet big biter that leads a group of stock to a wild nest field further out and starts a new culture there. It avoids fights and paths around cliffs and buildings. Kill it on the way and the new culture never starts.
lp-technician=Technicians are the only Synthexis staff on the ground: workers in sealed suits who carry feed between the biochambers. Without them the biochambers stop, and without the biochambers the incubators stop breeding. Shoot the technicians first.
lp-trooper=The trooper is your basic soldier: heavy armor and a submachine gun, and the cheapest unit on the command link. Troopers beat raiders, scouts and Shotgunners and lose to long-range lasers, so send them in numbers. Only a powered barracks heals them.
lp-breacher=The breacher carries demolition charges for walls and turrets. Against units the charges do little, and a breacher alone dies quickly. Send breachers in behind troopers and aim them at the pillboxes first. Trained on cluster grenades, their charges hit harder.
lp-rocket-trooper=The rocket trooper's rockets are made for armor and fliers; against troopers plain rockets are no better than a submachine gun, but explosive ones burst among them. It takes more of the command link than a trooper and outranges a Railgun tank's rail cannon. Keep rocket troopers behind your troopers against infantry, and in front against tanks and drones.
lp-flame-trooper=The flame trooper has the most damage of your infantry, and only the breacher has a shorter range. It burns biter swarms and bunched squads quickly but does little to vehicles, and nearly everything outranges it. Lead with it against Synthexis and keep it at the back against Kessler-Hayashi.
lp-gun-buggy=The gun buggy is a car with an autocannon, and the fastest unit you have. Its explosive rounds break up infantry, buggies and drones and do little to a tank's armor. Set a defending beacon's squad with a few of them and they reach the attack first. It rearms with piercing rounds or better, never firearm magazines.
lp-battle-tank=The battle tank fires a slow, heavy shell. It takes the longest to train and the most bandwidth. Its shell is made for buildings, so it is the tool for a walled camp and a poor one against crowds unless it fires explosive shells. Keep troopers with it.
