# The manual's words that the mod's code does not hold: what a unit is good and bad against, a card's blurb, a role
# where neither the locale nor scripts/roster.py has one, and the mottos that are not in shared.lua.
# Read by scripts/manual_qmd.py into docs/manual/_generated/lp-data.json and the cards. Words only: the generator stops
# on a digit here (every number comes from the code), on a key for a unit the roster no longer has, and on a unit
# that has no words where the code has none either. Where the code does say it (a corporation's research trigger says
# what a unit answers, the locale says what a breed is), the code wins and a line here for it is an error.
# Format: the locale's. [section], then unit=text.
# A blurb's voice (docs/reviews/2026-11-05-manual-voice-consult.md, 4.2): the unit is the subject of its first sentence,
# as a made thing with a lineage (its hull, its kit, its line); named hardware, designations in letters; one sentence of
# advice in the second person, and "you" nowhere else; no two cards of a faction open on the same construction; no
# research trigger (the card's Era line names the lab and era, and its Counters line is the trigger's own words).

[motto]
# Synthexis: its identity consult's tagline (docs/reviews/2026-10-22-synthexis-identity-consult.md), once its landing line.
synthexis=Engineered to adapt.
player=Hold the line, then take theirs.

