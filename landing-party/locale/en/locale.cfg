hq-down-grubstake=Grubstake Inc. has concluded its recovery operations at __1__. Thank you for your cooperation.
withdrawing-serenity=Kessler-Hayashi is withdrawing from __1__.
withdrawing-grubstake=Grubstake Inc. is withdrawing from __1__.
alert-raid=__1__ raid
