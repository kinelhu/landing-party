[tips-and-tricks-item-description]
lp-army=Your own units: trained in a barracks from the equipment you make, led by rally beacons, the command tool or the circuit network. How many you field is set by your command bandwidth.
lp-army-barracks=A [entity=lp-barracks] is built from an assembling machine 2, steel, electronic circuits and a [item=lp-command-core]. Your first core came with the research; the rest are salvaged from faction wreckage.\nPower it and pick what it trains as you would a recipe. Each order is made from your own kit, a trooper from heavy armor, a submachine gun and magazines. A finished order steps out as a unit and joins the nearest [entity=lp-rally-beacon].\nNothing deploys without a powered [entity=lp-command-relay].
lp-army-relays=Each powered [entity=lp-command-relay] lets you command __1__ more units. Command bandwidth research raises how many relays count; the rest are spares. A trooper takes __2__, a battle tank __3__.\nThe panel at the top of the screen shows your units against your bandwidth. If a relay dies or loses power, the newest units over the limit go offline: they stop and only fight back. Keep relays inside your defenses.
lp-army-beacons=A [entity=lp-rally-beacon] is a constant combinator. Its squad gathers at its rally point and does what its signals say:\n[virtual-signal=signal-A] advance on the nearest corporation turrets, [virtual-signal=signal-O] occupy an outpost, [virtual-signal=signal-R] retreat to a barracks and heal, [virtual-signal=signal-D] defend: hold, and go out to a strike force or an attack on your buildings within reach, then come back. No signal: hold.\n[virtual-signal=signal-X] and [virtual-signal=signal-Y] move the rally point that many tiles. Wired, it outputs [virtual-signal=signal-S] its squad's size, [virtual-signal=signal-E] corporation units and [virtual-signal=signal-T] corporation turrets near the rally point, [virtual-signal=signal-W] while a defending squad is out.\nHover over a beacon to see its squad, over a unit to see its beacon.
lp-army-command-tool=Press __CONTROL__lp-command-tool__ for the command tool. Drag to select units, right-click to move them or attack a corporation target, shift + right-click to attack-move. Selected units obey you until you release them with shift + drag.\nPress __CONTROL__lp-retire__ to send the selection home: each walks to a barracks and hands its order in, for your robots to collect.
lp-army-squads=Each kind of unit has a squad size signal, such as [virtual-signal=lp-squad-trooper]. Set one on a rally beacon and its squad keeps at most that many: new units join a beacon with room, and above the size the surplus joins another beacon with room, or retires to a barracks if none has. The panel beside a beacon's window sets the sizes.\nWired to a circuit, the sizes can change during play, for example more tanks when a threat scanner sees corporation armor.
lp-army-scanner=A [entity=lp-threat-scanner] outputs the corporation units and biters near it, by type. Wire one at an outpost through a decider combinator ("[virtual-signal=lp-scan-infantry] > 0, output [virtual-signal=signal-A] = 1") to a rally beacon: its squad marches out when a raid comes, and holds again when the scanner reads clear.\nA [virtual-signal=signal-S] check ("[virtual-signal=signal-S] ≥ 12, output A") holds a squad until it is full, then attacks.
lp-army-trains=Send a barracks [virtual-signal=signal-P] above zero and it keeps finished orders as items. Inserters, belts, trains and robots carry them like any other item. A [entity=lp-muster-point] at the front turns the orders put into it into units there, so they deploy without walking from the barracks.
lp-army-cannons=Build [entity=lp-orbital-cannon]s at the edge of a space platform over Nauvis, their barrels out over the void, with one [entity=lp-targeting-array] on the platform. They charge from orbital shells, thruster fuel, thruster oxidizer and power.\nOn Nauvis, press __CONTROL__lp-orbital-remote__ and click a point: the platform with the most charged cannons fires on it, and the next click fires the next platform. Its shells are cast on the ground (a foundry, round an electromagnetic plant's fuse) and shipped up by rocket.
