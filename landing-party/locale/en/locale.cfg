[entity-description]
lp-pen=A biter nest taken and fed by Synthexis. What it breeds is Synthexis's, not the wild nests'. Hit, it calls its wave home; killed, it drops a pheromone gland.
lp-bred=Bred by Synthexis in an incubator and marked in its colours. The wild biters leave it alone, and it leaves them alone.
lp-skim-yard=Where Grubstake keeps what it skimmed. Destroyed, what it holds spills.
lp-invoice-post=Kessler-Hayashi bills you here for the biter waves your pollution sends through its ground. Pay in circuits, modules, steel and the like, by their worth (other items stay). Paid off, it buys a truce: no attacks, and its line holds, for a minute per 10 paid (10 to 60).
lp-muster-point=Trooper, breacher and tank orders put in it become units here, sent to the nearest rally beacon. A barracks wired with signal P keeps its orders as items for you to carry here: by train, belt or robot.
lp-threat-scanner=Counts the corporations' units within 64 tiles, by kind, each second: a signal for each kind, a total for each corporation, the building crews apart, and the biters. Wire it to deciders and a rally beacon.
lp-jammer=Downs construction and logistic robots in its arcs, so what its siege breaks stays broken. Destroy the mast, or keep your roboports out of its reach.
lp-claim-stake=Mineral rights reassigned, driven out by a Grubstake truck. Unworked ground is claimed when the lamp runs out (it turns red near the end). Drill or stake the patch, or pull this down, and the claim is off.

