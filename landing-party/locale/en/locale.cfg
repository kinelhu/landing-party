[technology-description]
lp-orbital-cannon=Cannons on a space platform over Nauvis, called by remote. Each strike spends a charge from every ready cannon, within __1__ tiles.
lp-study-claims=Study the cargo of Grubstake's raiders and haulers to learn where it prospects.
lp-study-strip=Study the drills Grubstake uses to strip-mine ore.
lp-study-bait=Study how Grubstake's pacifier antennas keep biters away.
lp-study-flak=Study Grubstake's scrap cannons and drones.
lp-study-telemetry=Study how Synthexis's bred biters differ from wild ones.
lp-study-defoliant=Study what kills Synthexis creep.
lp-claims-register=Labels Grubstake's claims with their ore, reveals the ground around them and marks its strip camps on the map.
lp-strip-drill=A drill that mines twice as fast as an electric mining drill and depletes ore at half the rate.
lp-bait-made=Pheromone bait made without a gland. Bait placed inside a Grubstake claim also jams Grubstake's pact.
lp-flak-turret=A powered turret that fires flak at flying units only.
lp-bred-telemetry=Threat scanners report Synthexis biters and scouts apart from wild biters.
lp-defoliant=A thrown capsule that removes creep within __1__ tiles and damages tumors.
lp-incubator-capture=Synthexis incubators can be captured like biter spawners.
lp-player-dome=A powered dome that stops enemy artillery shells over your defenses.
lp-pact-breaker=Jams Grubstake's pact with the biters for __1__ minutes. Works only inside a Grubstake claim.
lp-claim-marker=A marker that makes Grubstake leave your buildings within __1__ tiles alone.
lp-orbital-strike=A single-use beacon that calls an orbital barrage on enemies within __1__ tiles.
lp-rail-rifle=A rifle whose slugs pierce every enemy in a __1__-tile line.
lp-pheromone-bait=Bait that makes nearby biters attack whatever is around it.
lp-cluster-shells=Artillery shells that burst into bomblets on impact.
lp-command-bandwidth=Increases the number of command relays that control your units.
lp-prize-serenity=Unlocks the mortar and mortar shells.
lp-prize-grubstake=Unlocks the strip drill.

