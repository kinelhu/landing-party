[mod-setting-description]
lp-difficulty=Scales every faction's strength, aggression and income. Each faction's own settings apply on top.
lp-landing-interval=Time between a faction's landings once the first has come.
lp-revenge-landings=A faction whose base you destroy sends its next landing with a larger escort.
lp-grubstake-enabled=Grubstake lands in this game. Turned off, it never lands again; its bases already standing stay.
lp-grubstake-arrival=What brings Grubstake's first landing.
lp-grubstake-camps=Most Grubstake bases standing at once, its headquarters counted.
lp-grubstake-strength=Maximum units per Grubstake base.
lp-grubstake-aggression=How soon and how often Grubstake attacks.
lp-grubstake-income=How fast Grubstake's bases make the parts they build and train with.
lp-grubstake-theft=Grubstake skims items from your belts and mines your ore.
lp-serenity-enabled=Kessler-Hayashi lands in this game. Turned off, it never lands again; its bases already standing stay.
lp-serenity-arrival=What brings Kessler-Hayashi's first landing.
lp-serenity-camps=Most Kessler-Hayashi bases standing at once, its headquarters counted.
lp-serenity-strength=Maximum units per Kessler-Hayashi base.
lp-serenity-aggression=How soon and how often Kessler-Hayashi attacks.
lp-serenity-income=How fast Kessler-Hayashi's bases make the parts they build and train with.
lp-serenity-orbital-strikes=Kessler-Hayashi calls orbital strikes on your walls during its sieges.
lp-biotech-enabled=Synthexis takes over biter spawners in this game. Turned off, it never arrives; a culture already standing stays.
lp-biotech-arrival-evolution=Synthexis arrives once the biters' evolution reaches this value.
lp-biotech-aggression=Time before Synthexis's first attack and between attacks.
lp-biotech-income=How fast Synthexis gains the biomass it breeds biters with.
lp-biotech-cultures=Most Synthexis cultures at once. A grown culture sends a carrier to found another.
lp-biotech-wave-max=Most biters in one Synthexis attack.
lp-biotech-learning=Synthexis remembers where its attacks failed and changes how it attacks there.
lp-chat-notices=Show faction activity in chat and as alerts. First landings and destroyed bases are always shown.

