lp-grubstake-aggression=How soon Grubstake acts: its ladder's climb, the gaps between its operations, answers and heists, and how long it keeps trying before standing down.
lp-serenity-strength=How much army Kessler-Hayashi fields: its camps' unit cap.
lp-serenity-aggression=How soon Kessler-Hayashi acts: its ladder's climb, the gaps between its operations, answers and heists, and how long it keeps trying before standing down.
lp-chat-notices=Tell the corporations' moves in chat and with alerts (for debugging). Off, they show in the world only; a corporation's first landing and a lost settlement are always told.

