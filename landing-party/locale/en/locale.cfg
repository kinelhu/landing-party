node-tesla=__1__ has fielded Tesla tanks. Your turrets go dark where their lightning lands.
node-scorcher=__1__ has welded flamethrowers onto old tank hulls. Mind your walls.
node-asbestos=__1__ has found a supply of asbestos suits. Its Shotgun hands and buggies no longer mind the fire.
clearing=__1__ is clearing biter nests at __2__.
