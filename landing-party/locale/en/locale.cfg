[mod-name]
landing-party=Landing Party

[mod-description]
landing-party=A rival machine faction lands and builds a factory of its own. Prototype.

[lp]
signs=Radar contact: the wreck of an unknown craft at __1__. Something is out there.
survey=A survey party has come down at __1__. It is mapping the ore. It will not stay long.
survey-destroyed=The survey party at __1__ is destroyed. Whoever sent it will take longer to come; its command core is in the wreckage.
survey-left=The survey party at __1__ has left. Its owners know where the ore is now.
develop=__1__ has expanded its capabilities: __2__.
landed=__1__ has landed at __2__. "__3__"
fallen=__1__ has lost its settlement at __2__. Its outposts are there for the taking, and its ruins can be salvaged.
uplink-down=The uplink has fallen. No more landings will come, and the faction can grow no stronger.
command-land=Land a Landing Party base this many tiles east of you (default 60).
command-trace=Toggle writing the planner's decisions to script-output/landing-party/decisions.txt.

