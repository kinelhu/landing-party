[mod-name]
landing-party=Landing Party

[mod-description]
landing-party=A rival machine faction lands and builds a factory of its own. Prototype.

[lp]
signs=Radar contact: the wreck of an unknown craft at __1__. Something is out there.
survey=A survey party has come down at __1__. It is mapping the ore. It will not stay long.
survey-destroyed=The survey party at __1__ is destroyed. Whoever sent it will take longer to come; its command core is in the wreckage.
survey-left=The survey party at __1__ has left. Its owners know where the ore is now.
develop=__1__ has expanded its capabilities: __2__.
plate-physical=armoured
plate-fire=fireproofed
plate-laser=reflective
node-optics=__1__ has recalibrated its optics (level __2__). Please remain behind the line.
node-warden=__1__ has issued Warden armour to its Line troopers.
node-handloads=__1__ has started hand-loading its shells (level __2__).
node-scrap-plating=__1__ is bolting scrap plating onto its Shotgun hands and buggies.
node-lance=__1__ has deployed Lances: Line troopers with the reach to keep your troopers at a distance.
node-shock=__1__ has fielded Shock troopers. Their lightning arcs from one of your troopers to the next.
node-sapper=__1__ is handing out dynamite. Its sappers throw it at whatever stands in the way.
node-slug=__1__ has bolted slug guns onto its buggies. Mind your vehicles.
node-salvage=__1__ has bought the salvage rights to everything it breaks. Your losses fund its research.
node-prospector=__1__ has trained its prospectors' eye: it strips further from your turrets and runs sooner.
node-hardened=__1__ has taught its siege crews to dig in.
node-aegis=__1__ has fielded Aegis tanks: laser cannons on armoured hulls.
node-dozer=__1__ has bought a Dozer. Your walls are now a suggestion.
node-scavenger=__1__ has armed its harriers with rockets. They are looking for your artillery.
node-counter=__1__ sends Shock troopers with its siege crews when your artillery is in reach.
node-asbestos=__1__ has found a supply of asbestos suits. Its Shotgun hands and buggies no longer mind the fire.
clearing=__1__ is clearing biter nests at __2__.
perimeter=__1__ has extended its perimeter at __2__ to __3__ tiles. Please remain behind the line.
perimeter-warning=__1__ will extend its perimeter past your __2__ at __3__ within ten minutes. Please remain behind the line.
claim=__1__ has registered a claim on the deposit at __2__. Resources in the right hands.
claim-outpost=__1__ has opened a permanent recovery site on the deposit at __2__. Thank you for your cooperation.
consolidating=__1__ is consolidating its holdings in this region. A regional headquarters will follow.
headquarters=__1__ has established its regional headquarters at __2__.
hq-down-serenity=Serenity Perimeter Group regrets the closure of its regional office at __1__. Please remain behind the line.
hq-down-grubstake=Grubstake Mineral Recovery has concluded its recovery operations at __1__. Thank you for your cooperation.
withdrawing-serenity=Serenity Perimeter Group is withdrawing from __1__.
withdrawing-grubstake=Grubstake Mineral Recovery is withdrawing from __1__.
alert-raid=__1__ raid
alert-siege=__1__ siege: a mortar is shelling you
alert-strip=__1__ is strip-mining your ore
alert-loot=__1__ is looting your storage
landed=__1__ has landed at __2__. "__3__"
landing-cleared=__1__'s lander burned a clearing at __2__: __3__ nests and worms destroyed.
grudge=__1__ will remember this. Its next landing will come with a double escort, ready for a siege.
grudge-landed=__1__ has landed at __2__, and it has not forgotten.
relief-pod=__1__: contractors arrived at the claim at __2__. Hazard pay approved.
pact-broken=__1__: pacifier antenna destroyed at __2__. Biters now attack its camps.
pact-restored=__1__: pacifier antenna rebuilt at __2__. Biters leave its camps alone again.
relief-column=__1__: a relief detachment is on its way to the perimeter site at __2__.
relief-drop=__1__: reinforcements dropped at the perimeter site at __2__.
fallen=__1__ has lost its settlement at __2__. Its outposts are there for the taking, and its ruins can be salvaged.
uplink-down=The uplink has fallen. No more landings will come, and the faction can grow no stronger.
command-land=Land a Landing Party base this many tiles east of you (default 60).
command-dev=Dev tools (admins): /lp list | raid | siege | strip | perimeter [id] | land <corp> [tiles] | parts <n> [id] | fast | grudge [id] | provoke | era <n> | trace
command-trace=Toggle writing the planner's decisions to script-output/landing-party/decisions.txt.

