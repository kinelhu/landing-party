[entity-description]
lp-orbital-cannon=Charges strikes from shells, thruster fuel and oxidizer: up to __1__, one each __2__ minutes. Built at a platform's edge.
lp-targeting-array=Lets the cannons of its platform fire on Nauvis while the platform is stopped there.
lp-player-dome=Stops enemy artillery shells within its radius while powered. Goes down for a time after too many hits.
lp-flak-turret=Fires flak at flying units only.
lp-tesla=Its lightning jumps between targets and briefly stops the laser and tesla turrets it hits.
lp-dome-projector=Holds a shield over part of a Kessler-Hayashi base that stops artillery shells. Units pass under it.
lp-orbital-relay=Directs Kessler-Hayashi's orbital strikes on spawners near its base.
lp-pen=A biter spawner taken over by Synthexis. Drops pheromone glands.
lp-bred-cinder=A fast biter that bursts when it dies, damaging walls, turrets and units nearby. Kill it at range.
lp-bred-big-burster=A huge biter that bursts at a turret guarding the way in, damaging all turrets nearby.
lp-bred-scout=Circles your defenses before an attack.
lp-bred-carrier=Carries a new Synthexis culture to wild spawners.
lp-harrier=A small ducted-fan attack drone, flown in numbers.
lp-scrap-copter=A cheap scrap helicopter that attacks in numbers.
lp-scavenger=A flying bomb that targets artillery, mortars and radars.
lp-laser-drone=An armored flying drone with a laser. Resists bullets.
lp-skyguard=A trooper with a long laser that tracks flying units. Weak against ground targets.
lp-flak-buggy=Fires flak at flying units. Weak against ground targets.
lp-bred-spore=Spits spores that hit flying units. Weak against ground targets.
lp-bred-stomper=A bred pentapod that steps over walls. Resists bullets.
lp-biochamber=Feeds a Synthexis incubator so it can breed.
lp-clinic=Makes Synthexis biters stronger. Without it, only small and medium biters are bred.
lp-runt=Tests your defenses for gaps before an attack.
lp-sweeper=Bursts in minefields to clear a path before an attack.
lp-tumor=Spreads Synthexis creep around it. Nothing can be built on creep.
lp-bred=Bred by Synthexis. Wild biters and Synthexis biters do not attack each other.
lp-skim-yard=Stores what Grubstake has stolen. Drops its contents when destroyed.
lp-invoice-post=Bills you for biter attacks caused by your pollution. Pay in circuits, modules or steel within __1__ minutes, or it raids to collect.
lp-muster-point=Turns unit orders into units and sends them to the nearest rally beacon.
lp-threat-scanner=Outputs the number of faction units and biters within __1__ tiles, by type.
lp-jammer=Destroys construction and logistic robots in range.
lp-claim-stake=Grubstake claims the ore here when the lamp runs out, unless the ore is being mined or the stake is destroyed.
lp-barracks=Trains units from orders.
lp-rally-beacon=Gathers a squad and orders it by signal: A advance, O occupy, R retreat, D defend, X and Y move its rally point.\nSquad size signals cap each unit it keeps.\nIt outputs S its squad, E and T enemy units and turrets near it, W while its squad is out defending.
lp-command-relay=Lets you command __1__ more units while powered. Research raises how many relays count.
lp-pact-breaker=Jams Grubstake's pact with the biters for __1__ minutes. Works only inside a Grubstake claim.
lp-claim-marker=Grubstake leaves your buildings within __1__ tiles alone.
lp-strike-beacon=Charges from your power, then calls an orbital barrage on enemies within __1__ tiles. Single use.
lp-player-mortar=Short-range artillery that fires mortar shells.
lp-strip-drill=Mines twice as fast as an electric mining drill and depletes ore at half the rate.
lp-player-bait=Makes nearby biters attack whatever is around it.
lp-pacifier=Keeps biters from attacking Grubstake. Drops pheromone glands, and sometimes a pacifier crystal.
lp-claim-rig=Digs a tunnel toward your base for a Grubstake raiding crew.
lp-power-tap=Draws power from your electric network.
lp-power-receiver=Draws power from your electric network.
lp-uplink=The center of a faction's headquarters. Destroying it destroys the headquarters, and the faction withdraws.
lp-lander=The center of a faction base. Destroying it destroys the base.

