line-held=__1__'s line is held at __2__: it lost __3__ drones building a post there and has given it up.
crew-gave-up=__1__ has given up building at __2__: it lost __3__ crews there.
border-broken=You built on __1__'s side of the border at __2__. The treaty is broken.
