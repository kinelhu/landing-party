[technology-description]
lp-pact-breaker=Grubstake's pacifier crystal, taken apart: set inside a Grubstake claim, it jams its pact with the biters for 3 minutes. Research by disassembling a pacifier crystal.
lp-claim-marker=Grubstake's pacifier crystal, taken apart: Grubstake reads your buildings within 40 tiles of the marker as its own claim and leaves them alone. Research by disassembling two pacifier crystals.
lp-orbital-strike=Kessler-Hayashi's orbital beacon, taken apart: a beacon that, charged on your power, calls Kessler-Hayashi's own barrage on every nest and enemy building within 60 tiles, and burns out. Research by disassembling an orbital beacon, from a Kessler-Hayashi lander or uplink.
lp-rail-rifle=Kessler-Hayashi's railgun, taken apart: a rifle whose slug pierces a 30-tile line. Research by disassembling two rail coils, from Kessler-Hayashi's railgunners.
lp-pheromone-bait=Grubstake's gland, taken apart: a bait that calls the idle biters round it to attack whatever they meet there. Grubstake's pact keeps them off Grubstake. Research by disassembling three pheromone glands, from Grubstake's pacifier antennas and Synthexis incubators.
lp-cluster-shells=Kessler-Hayashi's cluster fuze, taken apart: your artillery shells burst into bomblets round the impact. Research by disassembling three cluster fuzes, taken from Kessler-Hayashi's mortars and howitzers.
lp-command-bandwidth=More command relays carry your units. The first level unlocks barracks and grants a command core; more come from the Landing Party's wreckage.

